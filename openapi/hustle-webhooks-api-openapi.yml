openapi: 3.1.0
info:
  title: Hustle Public Access Token Webhooks API
  version: v3
  description: The Hustle Public API exposes a RESTful interface to provide programmatic access to resources within your Hustle account. The API is defined using the OpenAPI specification (aka Swagger) which can be downloaded above and used to generate a client in various languages. This may help speed up integration with the API, but is not required.
servers:
- url: /v3
tags:
- name: Webhooks
paths:
  /webhook_registrations:
    get:
      summary: Get Webhook Registrations
      description: Get a list of webhook registrations scoped by the query parameters.
      tags:
      - Webhooks
      parameters:
      - schema:
          type: string
          description: Webhook registration ID.
        required: false
        description: Webhook registration ID.
        name: id
        in: query
      - schema:
          type: string
          enum:
          - consentUpdate-v1
          - messageStatus-v1
          description: Filter by webhook configuration type.
        required: false
        description: Filter by webhook configuration type.
        name: configType
        in: query
      - schema:
          type: string
          description: Cursor for start of next set of items. Pass whatever you receive from the response to get the next elements in the array.
        required: false
        description: Cursor for start of next set of items. Pass whatever you receive from the response to get the next elements in the array.
        name: cursor
        in: query
      - schema:
          type: number
          maximum: 1000
          minimum: 1
          description: Limit of items per page.
        required: false
        description: Limit of items per page.
        name: limit
        in: query
      responses:
        '200':
          description: Returns a list of webhook registrations that match the query parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookRegistration'
                    description: List of webhook registrations that match the specified filter.
                  cursor:
                    type:
                    - string
                    - 'null'
                    description: Cursor for start of next set of items. If there were no items to return with the last cursor you passed, this will return null.
                  hasMore:
                    type: boolean
                    description: Whether there are more items to load past this cursor.
                required:
                - items
                - cursor
                - hasMore
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Webhook Registration
      description: Create a new webhook registration to receive webhook events. For more information and documentation, see https://api.hustle.com/docs/webhooks.
      tags:
      - Webhooks
      requestBody:
        description: The details of the webhook registration being created.
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUrl:
                  type: string
                  format: uri
                  description: The URL that will receive webhook events.
                secretForHMAC:
                  type: string
                  description: Secret key used for HMAC signature verification of webhook events.
                config:
                  $ref: '#/components/schemas/WebhookConfig'
              required:
              - targetUrl
              - secretForHMAC
              - config
              additionalProperties: false
      responses:
        '201':
          description: Returns the created webhook registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRegistration'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook_registrations/{id}:
    put:
      summary: Update Webhook Registration
      description: Update an existing webhook registration.
      tags:
      - Webhooks
      parameters:
      - schema:
          type: string
          description: The ID of the webhook registration to update.
        required: true
        description: The ID of the webhook registration to update.
        name: id
        in: path
      requestBody:
        description: The details of the webhook registration to update.
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUrl:
                  type: string
                  format: uri
                  description: The URL that will receive webhook events.
                secretForHMAC:
                  type: string
                  description: Secret key used for HMAC signature verification of webhook events.
                config:
                  $ref: '#/components/schemas/WebhookConfig'
              additionalProperties: false
      responses:
        '200':
          description: Returns the updated webhook registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRegistration'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Webhook Registration
      description: Delete an existing webhook registration.
      tags:
      - Webhooks
      parameters:
      - schema:
          type: string
          description: The ID of the webhook registration to delete.
        required: true
        description: The ID of the webhook registration to delete.
        name: id
        in: path
      responses:
        '200':
          description: Returns confirmation of successful deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the deletion was successful.
                required:
                - success
                additionalProperties: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook_registrations/mock_event:
    post:
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              ~standard:
                vendor: zod
                version: 1
              def:
                type: object
                shape:
                  code:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: number
                      checks: []
                    minValue: null
                    maxValue: null
                    isInt: false
                    isFinite: true
                    format: null
                  message:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: string
                    format: null
                    minLength: null
                    maxLength: null
                  hustleErrorCode:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: optional
                      innerType:
                        ~standard:
                          vendor: zod
                          version: 1
                        def:
                          type: string
                        format: null
                        minLength: null
                        maxLength: null
                catchall:
                  ~standard:
                    vendor: zod
                    version: 1
                  def:
                    type: never
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              ~standard:
                vendor: zod
                version: 1
              def:
                type: object
                shape:
                  code:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: number
                      checks: []
                    minValue: null
