                    isInt: false
                    isFinite: true
                    format: null
                  message:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: string
                    format: null
                    minLength: null
                    maxLength: null
                  hustleErrorCode:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
                      type: optional
                      innerType:
                        ~standard:
                          vendor: zod
                          version: 1
                        def:
                          type: string
                        format: null
                        minLength: null
                        maxLength: null
                catchall:
                  ~standard:
                    vendor: zod
                    version: 1
                  def:
                    type: never
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              ~standard:
                vendor: zod
                version: 1
              def:
                type: object
                shape:
                  code:
                    ~standard:
                      vendor: zod
                      version: 1
                    def:
