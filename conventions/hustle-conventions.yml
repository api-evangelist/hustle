generated: '2026-08-13'
method: searched
source: https://api.hustle.com/v3/docs/description.html
docs: https://api.hustle.com/v3/docs/
spec: openapi/_original/hustle-openapi-original.json
authentication:
  style: oauth2-client-credentials
  header: 'Authorization: Bearer <access_token>'
  token_endpoint: https://api.hustle.com/v3/oauth/token
  ref: authentication/hustle-authentication.yml
idempotency:
  supported: true
  mechanism: >-
    Lead ingestion is idempotent by natural key. POST /leads is an "Upsert Lead"
    operation keyed on the (organizationId, phoneNumber) pair: inserting a lead
    whose pair already exists overwrites/updates the existing record and returns
    200, while a genuinely new pair returns 201. This natural-key upsert is the
    API's documented idempotency contract; there is no separate Idempotency-Key
    header.
  scope: POST /leads (upsert by organizationId + phoneNumber)
  evidence: >-
    Spec summary "Upsert Lead"; description "Creates a new lead or updates the
    existing lead in the organization with that phone number." 200 = updated
    existing, 201 = created new. The phoneNumber schema note states the
    combination of organizationId and phoneNumber represents a lead and that
    inserting existing values overwrites the existing lead.
pagination:
  style: cursor
  default_page_size: 100
  max_page_size: 1000
  request_params:
    cursor: Opaque cursor marking the start of the next page.
    limit: >-
      Maximum number of items to return. Default 100, maximum 1000; the docs
      warn "please note these values may change". Enforced in the OpenAPI as
      minimum 1 / maximum 1000.
  response_fields:
    items: Array of resources for the current page.
    cursor: Cursor for the next page; null when no further items remain.
    hasMore: Boolean indicating whether more items exist past this cursor.
  applies_to: [GET /agents, GET /groups, GET /leads]
filtering:
  detail: >-
    List endpoints accept resource-scoped query filters, e.g. GET /leads
    supports id, phoneNumber, organizationId, groupId, and leadStatusInGroup;
    GET /agents supports id and groupId; GET /groups supports id,
    organizationId, and active.
versioning:
  scheme: uri-path
  current: v3
  base: https://api.hustle.com/v3
error_envelope:
  media_type: application/json
  schema: ErrorResponse
  ref: errors/hustle-problem-types.yml
webhooks:
  supported: true
  signature: HMAC (secretForHMAC) signed events
  ref: asyncapi/hustle-webhooks.yml
rate_limiting:
  documented: true
  policy: 25 requests per second for endpoints returning resources; POST /oauth/token instead limits FAILED attempts (10 → temporary IP block for that account, 100 in 24h → IP block).
  headers: []
  headers_documented: false
  status_code: null
  note: >-
    The limits are published in the "Rate Limiting" section of the developer
    guide, but no RateLimit-* / X-RateLimit-* / Retry-After response headers are
    documented or declared in the OpenAPI, and no 429 response is declared
    anywhere in the spec. A client cannot read remaining quota at runtime; the
    documented remedy is to self-throttle parallelism and retry on error.
  ref: rate-limits/hustle-rate-limits.yml
request_tracing:
  request_id_header: null
  note: >-
    No request-id / correlation header is documented or declared. On a 422 the
    error envelope may carry `hustleErrorCode`, which the docs say to pass to
    Hustle support — that is the closest thing to a support correlation handle.
field_expansion:
  supported: false
  note: No expand / sparse-fieldset parameters are declared on any operation.
metadata:
  supported: true
  mechanism: >-
    Leads carry account-defined `customFields` (created via POST /custom_fields,
    set via POST /leads or the setCustomField operation on PATCH /leads) and
    `tags`. There is no generic free-form `metadata` object on other resources.
response_shape:
  single_resource_minimum_fields: [id, type, createdAt]
  list_envelope: {items: array, cursor: string, hasMore: boolean}
  note: >-
    "Every response from the api, including errors, will be returned as JSON in
    the body of the response and the content-type header set accordingly to
    application/json." Single resources always carry at least id (Hustle's
    unique identifier), type (the resource type) and createdAt (ISO 8601).
token_handling:
  token_lifetime_seconds: 7200
  format: JWT
  guidance: >-
    "Access tokens are JSON Web Tokens (JWT) and are valid for two hours (7200
    seconds)." Long-running processes should reuse a token until it expires and
    mint a new one on a 401, then retry the request — repeated failed token
    requests are what triggers the IP block.
changelog_ref: changelog/hustle-changelog.yml
lifecycle_ref: lifecycle/hustle-lifecycle.yml
