notes: >-
  Re-probed 2026-08-13: Hustle serves NO /.well-known discovery document on
  either the API host or the marketing host. api.hustle.com answers every
  unknown path with its own JSON 404 envelope
  ({"code":404,"message":"Resource not found at path /.well-known/..."}), and
  hustle.com answers with an nginx 404 body — neither is a soft-200 SPA
  catch-all, so these are true negatives. This file records a measured ABSENCE:
  per the enrichment contract no `WellKnown` or `SecurityTxt` pointer is wired
  into apis.yml, because the pointer would assert that Hustle serves a surface
  it does not. The WellKnown pointers carried on all nine API entries from the
  2026-07-19 round were removed for this reason. Notably, the OAuth2
  client-credentials token endpoint at /v3/oauth/token publishes no RFC 8414
  authorization-server metadata, so an agent cannot discover it without reading
  the human docs.
