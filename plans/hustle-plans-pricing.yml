    note: >-
      "Per-segment or per-message pricing available" with "discounted
      messages/segments based on volume". Hustle does not publish the per-unit
      rate or the volume tiers for this model — quoted by sales.
  included_quota: null
  overage: null
  commitment: 1 year minimum
  features:
  - Priority in the support queue
  - Support of a CSM (Client Success Manager)
  - Discounted messages/segments based on volume
  - Ability to send messages over a short code
  - Access to Hustle Stories
