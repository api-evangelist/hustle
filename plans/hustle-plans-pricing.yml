included_with_every_subscription:
- 10DLC and compliance support
- Access to the full Hustle platform
- P2P messaging
- Broadcast messaging
- Video messaging (Clips and Personalized Clips)
- Dialer
- Free incoming messages, inbound calls, and inbound videos/images
- No hidden carrier or 10DLC registration fees
api_pricing:
  published: false
  note: >-
    No API-specific plan, call quota, or per-request price is published. The
    Public API v3 is a platform capability; access is governed by the client_id
    / client_secret Hustle issues to an account. Runtime throttling is documented
    separately at rate-limits/hustle-rate-limits.yml (25 req/s).
self_serve:
  available: false
  note: >-
    Both models funnel to a demo request form; there is no published online
    checkout or free tier. `accessModel.pricing` in apis.yml is therefore
    "quote-and-demo" for the annual tier and list-priced for PAYGO.
