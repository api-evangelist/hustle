docs: https://hustle.com/pricing/
currency: USD
plan_count: 2
summary: >-
  Hustle publishes two platform subscription models on its public pricing page:
  a pay-as-you-go (PAYGO) model with a flat platform fee plus per-segment
  messaging, and an annual commitment starting at a stated floor. Pricing is for
  the messaging platform, not for API access — the Public API v3 is included
  with the platform and carries no separately published API tier, metering or
  per-call price. There is no self-serve checkout: both paths route to "Request
  a Demo" / "Book a demo".
plans:
- name: Pay-as-you-go (PAYGO)
  slug: paygo
  price: 250
  currency: USD
  price_note: '$250 platform fee'
  billing_period: unspecified
  usage_pricing:
  - metric: SMS segment
    price: 0.04
    currency: USD
    note: All PAYGO subscriptions are billed per segment. PAYGO plans are only available in segments (not per-message).
  included_quota: null
  overage: >-
    No bundled quota — every segment is billed at $0.04, so there is no overage
    tier.
  commitment: none
  features:
  - Reach your audience without long-term commitments
  - Only pay for what you need, when you need it
  - Start messaging (and calling) quickly
  limits:
  - Segment (not per-message) pricing only
  - No short-code sending (short code requires an annual commitment)
  - No Hustle Stories (annual commitment only)
  - No dedicated CSM and no support-queue priority
  url: https://hustle.com/paygo/
