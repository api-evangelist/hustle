aid: hustle
name: Hustle
description: >-
  Hustle is an employee-owned text, video, and voice communications platform
  that lets organizations engage audiences at scale from a single interface.
  It combines broadcast texting, peer-to-peer 1:1 conversational texting, video
  messaging (Hustle Clips, Personalized Clips, and Hustle Stories), and an
  outbound dialer, and is used by nonprofits, educational institutions,
  commercial businesses, political campaigns, government agencies, and labor
  unions to reach people over the channels they already use. The Hustle Public
  API (v3) exposes a RESTful, OAuth2 client-credentials interface for managing
  agents, groups, leads, custom fields, tags, organizations, CRM integrations,
  message delivery status, and webhook registrations. Hustle was added to the API Evangelist network as a
  portfolio company of GV and Insight Partners and enriched from its public
  developer surface.
